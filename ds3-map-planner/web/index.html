<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS3 Map Planner</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171b22;
        --line: #2a3342;
        --text: #e7edf7;
        --muted: #9fb0c9;
        --accent: #6ee7ff;
        --saved: #4ade80;
        --pending: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px Segoe UI, sans-serif;
        letter-spacing: 0;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #141820;
      }
      .header-inner,
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }
      .header-inner {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      nav a {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        text-decoration: none;
      }
      nav a:hover,
      nav a:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      main {
        padding: 28px 0 48px;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0;
        font-size: 17px;
      }
      #summary,
      #status {
        color: var(--muted);
        font-size: 13px;
      }
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }
      table {
        width: 100%;
        min-width: 880px;
        border-collapse: collapse;
      }
      th,
      td {
        height: 48px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }
      th {
        height: 42px;
        color: var(--muted);
        background: #12161d;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #1b222c;
      }
      .map-name {
        font-weight: 600;
      }
      .map-id {
        margin-top: 2px;
        color: var(--muted);
        font: 12px Consolas, monospace;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 0 9px;
        border: 1px solid transparent;
        border-radius: 5px;
        color: var(--muted);
        text-decoration: none;
        white-space: nowrap;
      }
      .state:hover,
      .state:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .state::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pending);
        content: "";
      }
      .state.saved {
        color: var(--saved);
      }
      .state.saved::before {
        background: var(--saved);
      }
      .error {
        color: #fb7185;
      }
      @media (max-width: 680px) {
        .header-inner {
          align-items: stretch;
          flex-direction: column;
          padding: 14px 0;
        }
        nav {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        nav a {
          justify-content: center;
          text-align: center;
        }
        .section-head {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>DS3 Map Planner</h1>
        <nav aria-label="Planner pages">
          <a href="./filters.html">Stage 1-3 Filters</a>
          <a href="./regions.html">Stage 4-6 Regions</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="section-head">
        <h2>Map Progress</h2>
        <div id="summary">Loading maps...</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Map</th>
              <th scope="col">Stage 1 Collision</th>
              <th scope="col">Stage 2 Navmesh</th>
              <th scope="col">Stage 3 Marked Nav</th>
              <th scope="col">Stage 4 Regions</th>
              <th scope="col">Stage 6 Plans</th>
            </tr>
          </thead>
          <tbody id="mapRows"></tbody>
        </table>
      </div>
      <p id="status" role="status">Reading planner state...</p>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
