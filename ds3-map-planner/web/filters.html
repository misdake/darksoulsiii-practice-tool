<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS3 Map Planner</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171b22;
        --line: #2a3342;
        --text: #e7edf7;
        --muted: #9fb0c9;
        --accent: #6ee7ff;
        --ok: #87f5b1;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: radial-gradient(
          circle at 20% 20%,
          #1a2432 0%,
          var(--bg) 50%
        );
        color: var(--text);
        font-family: "Segoe UI", "Noto Sans", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(620px, calc(100vw - 32px));
        background: color-mix(in srgb, var(--panel) 92%, black);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        z-index: 10;
      }

      #panel.panel-collapsed {
        width: auto;
        min-width: 190px;
        padding: 8px 10px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-title {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }

      #panelCollapseBtn {
        width: 30px;
        height: 26px;
        padding: 0;
        font-size: 16px;
        line-height: 1;
      }

      #panel.panel-collapsed #panelContent {
        display: none;
      }

      .row {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }

      .row label {
        color: var(--muted);
        font-size: 12px;
      }

      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        background: #0d1117;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        box-sizing: border-box;
      }

      .toggles,
      .actions,
      .stages {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      button {
        border: 1px solid var(--line);
        background: #111723;
        color: var(--text);
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 12px;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(110, 231, 255, 0.12);
      }

      .home-link {
        display: block;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        text-align: center;
        text-decoration: none;
      }

      .home-link:hover {
        border-color: var(--accent);
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
        color: var(--ok);
        white-space: pre-wrap;
      }

      .progress-wrap {
        margin-top: 10px;
      }

      .progress-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #0d1117;
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22d3ee, #34d399);
      }

      .stages label {
        font-size: 12px;
        color: var(--muted);
      }

      details {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #0d1117;
        max-height: 240px;
        overflow: auto;
      }

      summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
      }

      .obj-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin: 4px 0;
        border-radius: 4px;
        padding: 2px 4px;
      }

      .hf-list {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #0d1117;
        max-height: 180px;
        overflow: auto;
      }

      .hf-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        padding: 4px 2px;
      }

      .hf-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #111723;
        color: var(--text);
        cursor: pointer;
      }

      .hf-btn svg {
        width: 16px;
        height: 16px;
        display: block;
      }

      .obj-item-selected {
        background: rgba(110, 231, 255, 0.22);
      }

      #boxSelectOverlay {
        position: fixed;
        left: 0;
        top: 0;
        border: 1px solid #6ee7ff;
        background: rgba(110, 231, 255, 0.14);
        pointer-events: none;
        z-index: 20;
        display: none;
      }

      .stage-panel-title {
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .config-details {
        max-height: none;
        overflow: visible;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boxSelectOverlay"></div>
    <div id="panel">
      <div class="panel-header">
        <div class="panel-title">DS3 Map Planner</div>
        <button
          id="panelCollapseBtn"
          type="button"
          title="Collapse panel"
          aria-label="Collapse panel"
          aria-expanded="true"
        >
          −
        </button>
      </div>
      <div id="panelContent">
        <div class="row">
          <label>Map</label
          ><select id="mapSelect"></select>
        </div>
        <div class="stages">
          <label
            ><input type="radio" name="stage" value="1" /><span
              data-stage-label="1"
              >Stage 1</span
            ></label
          >
          <label
            ><input type="radio" name="stage" value="2" /><span
              data-stage-label="2"
              >Stage 2</span
            ></label
          >
          <label
            ><input type="radio" name="stage" value="3" /><span
              data-stage-label="3"
              >Stage 3</span
            ></label
          >
        </div>
        <div class="actions" id="commonStageControls">
          <button id="fitBtn">Fit Camera</button>
          <button id="saveBtn">Save Current Stage</button>
          <a class="home-link" href="./index.html">Home</a>
        </div>
        <div class="actions" id="stage12Controls">
          <button id="resetVisibleBtn">Reset Visible</button>
        </div>
        <div class="actions" id="stage3Controls" style="display: none">
          <button id="resetNavSegmentBtn">Reset Nav Segment</button>
          <button id="cameraModeBtn" style="display: none">
            Enter Third-Person (F)
          </button>
          <label
            ><input id="stage3HideCollision" type="checkbox" /> Hide
            Collision</label
          >
          <label
            >Collision Opacity
            <input
              id="stage3CollisionOpacity"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="0.7"
          /></label>
          <output id="stage3CollisionOpacityValue" for="stage3CollisionOpacity"
            >0.70</output
          >
        </div>
        <div class="progress-wrap" id="loadProgressWrap">
          <div class="progress-head">
            <span id="loadProgressText">idle</span>
            <span id="loadProgressPct">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="loadProgressFill"></div>
          </div>
        </div>
        <div id="stageObjectLists">
          <details>
            <summary>HitFilter Groups</summary>
            <div class="hf-list" style="margin-top: 8px">
              <div id="hitFilterList"></div>
            </div>
          </details>
          <details>
            <summary>Collision Objects</summary>
            <div id="collisionList"></div>
          </details>
          <details>
            <summary>Navmesh Objects</summary>
            <div id="navmeshList"></div>
          </details>
        </div>
        <div id="status">ready</div>
      </div>
    </div>
    <script type="module" src="./filters.js"></script>
  </body>
</html>
