<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DS3 Tile Preview</title>
  <style>
    :root { --bg:#111318; --panel:#1b1f28; --line:#2f3747; --text:#e8edf7; --muted:#9aa7bf; --acc:#7fb0ff; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:Consolas, Menlo, monospace; }
    #app { width:100%; height:100%; position:relative; }
    #panel {
      position:absolute; left:10px; top:10px; z-index:2; background:rgba(27,31,40,.92);
      border:1px solid var(--line); border-radius:10px; padding:10px; width:420px;
    }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .row input, .row select, .row button {
      background:#151922; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px;
    }
    .row input { flex:1; min-width:0; }
    .stat { font-size:12px; color:var(--muted); }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div class="row">
        <label>Source</label>
        <select id="sourceSel"></select>
      </div>
      <div class="row">
        <label>Scale mode</label>
        <select id="modeSel">
          <option value="auto">Auto</option>
          <option value="manual">Manual</option>
        </select>
        <label>Level</label>
        <select id="levelSel"></select>
      </div>
      <div class="row" id="scaleButtons"></div>
      <div class="row">
        <label><input type="checkbox" id="showLoops" checked /> Show Loops</label>
      </div>
      <div class="stat" id="stat1">-</div>
      <div class="stat" id="stat2">Drag: pan, Wheel: zoom.</div>
    </div>
    <canvas id="view"></canvas>
  </div>

<script>
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const sourceSel = document.getElementById('sourceSel');
const modeSel = document.getElementById('modeSel');
const levelSel = document.getElementById('levelSel');
const scaleButtons = document.getElementById('scaleButtons');
const showLoops = document.getElementById('showLoops');
const stat1 = document.getElementById('stat1');

let tileIndex = null;
let levelList = [];
let levelMaps = new Map();
let imageCache = new Map();
let walkableLoops = [];

let centerX = 0;
let centerZ = 0;
let worldSpanX = 4096;
let currentTilesRoot = './tiles';

let dragging = false;
let dragLastX = 0;
let dragLastY = 0;

function resize() {
  canvas.width = Math.max(1, canvas.clientWidth * devicePixelRatio);
  canvas.height = Math.max(1, canvas.clientHeight * devicePixelRatio);
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

function decodeCoord(name) {
  const v = Number(name);
  if (!Number.isInteger(v)) return null;
  return v;
}
function encodeCoord(v) {
  return String(v);
}

function alignCenterToPixelGridForLevel(level) {
  const wuPerPx = tileIndex.scales_world_units_per_pixel[level];
  centerX = Math.round(centerX / wuPerPx) * wuPerPx;
  centerZ = Math.round(centerZ / wuPerPx) * wuPerPx;
}

async function loadIndex(root) {
  currentTilesRoot = (root || './tiles').replace(/\/$/, '');
  const res = await fetch(`${currentTilesRoot}/index.json`);
  if (!res.ok) throw new Error(`index load failed: ${res.status}`);
  tileIndex = await res.json();

  levelList = Object.keys(tileIndex.levels).map(Number).sort((a,b)=>a-b);
  levelSel.innerHTML = '';
  scaleButtons.innerHTML = '';
  for (const lv of levelList) {
    const wuPerPx = tileIndex.scales_world_units_per_pixel[lv];
    const scaleMul = wuPerPx > 0 ? Math.round(1 / wuPerPx) : 1;
    const op = document.createElement('option');
    op.value = String(lv);
    op.textContent = `z=${lv} (x${scaleMul}, ${wuPerPx} wu/px)`;
    levelSel.appendChild(op);

    const btn = document.createElement('button');
    btn.textContent = `x${scaleMul}`;
    btn.title = `Set point-to-point zoom for z=${lv}`;
    btn.addEventListener('click', () => {
      const wasAuto = modeSel.value === 'auto';
      if (!wasAuto) modeSel.value = 'manual';
      levelSel.value = String(lv);
      worldSpanX = wuPerPx * Math.max(1, canvas.clientWidth);
      alignCenterToPixelGridForLevel(lv);
    });
    scaleButtons.appendChild(btn);
  }

  levelMaps.clear();
  for (const [z, lv] of Object.entries(tileIndex.levels)) {
    const xMap = new Map();
    for (const [xName, yArr] of Object.entries(lv.x)) {
      xMap.set(xName, new Set(yArr));
    }
    levelMaps.set(z, xMap);
  }

  // initialize center from full finest-level bounds.
  const z0 = String(levelList[levelList.length - 1]);
  const lv0 = tileIndex.levels[z0];
  const tw = lv0.tile_world_size;
  let minTx = Infinity, maxTx = -Infinity, minTy = Infinity, maxTy = -Infinity;
  for (const [xName, yArr] of Object.entries(lv0.x)) {
    const tx = decodeCoord(xName);
    if (tx == null) continue;
    minTx = Math.min(minTx, tx);
    maxTx = Math.max(maxTx, tx);
    for (const yName of yArr) {
      const ty = decodeCoord(yName);
      if (ty == null) continue;
      minTy = Math.min(minTy, ty);
      maxTy = Math.max(maxTy, ty);
    }
  }
  if (Number.isFinite(minTx) && Number.isFinite(minTy)) {
    const minX = minTx * tw;
    const maxX = (maxTx + 1) * tw;
    const minZ = minTy * tw;
    const maxZ = (maxTy + 1) * tw;
    centerX = (minX + maxX) * 0.5;
    centerZ = (minZ + maxZ) * 0.5;
    worldSpanX = Math.max(maxX - minX, tw * 2);
  } else {
    centerX = 0;
    centerZ = 0;
    worldSpanX = tw * 4;
  }

  levelSel.value = String(levelList[Math.floor(levelList.length / 2)]);
  modeSel.value = 'auto';

  walkableLoops = [];
  try {
    const wr = await fetch(`${currentTilesRoot}/walkable_loops_merged.json`);
    if (wr.ok) {
      const wj = await wr.json();
      if (Array.isArray(wj.loops)) {
        walkableLoops = wj.loops;
      }
    }
  } catch (_) {}
}

function pickLevelAuto() {
  const screenW = Math.max(1, canvas.clientWidth);
  const target = worldSpanX / screenW;
  let best = levelList[0];
  let bestErr = Infinity;
  for (const lv of levelList) {
    const s = tileIndex.scales_world_units_per_pixel[lv];
    const err = Math.abs(Math.log2(target / s));
    if (err < bestErr) { bestErr = err; best = lv; }
  }
  return best;
}

function currentLevel() {
  if (!tileIndex) return null;
  if (modeSel.value === 'manual') return Number(levelSel.value);
  return pickLevelAuto();
}

function minPointToPointSpanX() {
  if (!tileIndex || !Array.isArray(tileIndex.scales_world_units_per_pixel) || tileIndex.scales_world_units_per_pixel.length === 0) {
    return 64;
  }
  const finest = Math.min(...tileIndex.scales_world_units_per_pixel);
  return finest * Math.max(1, canvas.clientWidth);
}

function worldToScreen(wx, wz) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const spanY = worldSpanX * (h / Math.max(1, w));
  const x = ((wx - (centerX - worldSpanX / 2)) / worldSpanX) * w;
  const y = ((wz - (centerZ - spanY / 2)) / spanY) * h;
  return [x, y];
}

function ensureImage(url) {
  if (imageCache.has(url)) return imageCache.get(url);
  const item = { img: new Image(), ok: false, done: false };
  item.img.onload = () => { item.ok = true; item.done = true; };
  item.img.onerror = () => { item.ok = false; item.done = true; };
  item.img.src = url;
  imageCache.set(url, item);
  return item;
}

function drawWalkableOverlay() {
  if (!showLoops.checked) return;
  if (!Array.isArray(walkableLoops) || walkableLoops.length === 0) return;
  ctx.save();
  ctx.strokeStyle = '#00d2a8';
  ctx.lineWidth = 1.5;
  for (const loop of walkableLoops) {
    if (!Array.isArray(loop) || loop.length < 2) continue;
    ctx.beginPath();
    let started = false;
    for (const p of loop) {
      if (!Array.isArray(p) || p.length < 3) continue;
      const [sx, sy] = worldToScreen(p[0], p[2]);
      if (!started) {
        ctx.moveTo(sx, sy);
        started = true;
      } else {
        ctx.lineTo(sx, sy);
      }
    }
    if (started) ctx.stroke();
  }
  ctx.restore();
}

function render() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0d1016';
  ctx.fillRect(0, 0, w, h);

  if (!tileIndex) {
    requestAnimationFrame(render);
    return;
  }

  const z = currentLevel();
  if (modeSel.value === 'auto' && levelSel.value !== String(z)) {
    levelSel.value = String(z);
  }
  const zName = String(z);
  const level = tileIndex.levels[zName];
  const xMap = levelMaps.get(zName);
  if (!level || !xMap) {
    requestAnimationFrame(render);
    return;
  }

  const tw = level.tile_world_size;
  const spanY = worldSpanX * (h / Math.max(1, w));
  const minX = centerX - worldSpanX / 2;
  const maxX = centerX + worldSpanX / 2;
  const minZ = centerZ - spanY / 2;
  const maxZ = centerZ + spanY / 2;

  const tx0 = Math.floor(minX / tw);
  const tx1 = Math.floor(maxX / tw);
  const ty0 = Math.floor(minZ / tw);
  const ty1 = Math.floor(maxZ / tw);

  let drawn = 0;
  const ext = tileIndex.image_ext || 'jpg';

  for (let tx = tx0; tx <= tx1; tx++) {
    const xName = encodeCoord(tx);
    const ySet = xMap.get(xName);
    if (!ySet) continue;

    for (let ty = ty0; ty <= ty1; ty++) {
      const yName = encodeCoord(ty);
      if (!ySet.has(yName)) continue;

      const url = `${currentTilesRoot}/${zName}/${xName}/${yName}.${ext}`;
      const state = ensureImage(url);

      const x0 = tx * tw, x1 = x0 + tw;
      const y0 = ty * tw, y1 = y0 + tw;
      const [sx0, sy0] = worldToScreen(x0, y0);
      const [sx1, sy1] = worldToScreen(x1, y1);
      const ix0 = Math.round(sx0);
      const iy0 = Math.round(sy0);
      const ix1 = Math.round(sx1);
      const iy1 = Math.round(sy1);
      const dw = ix1 - ix0, dh = iy1 - iy0;

      if (state.done && state.ok) {
        ctx.drawImage(state.img, ix0, iy0, dw, dh);
        drawn++;
      } else {
        ctx.strokeStyle = '#243042';
        ctx.strokeRect(ix0 + 0.5, iy0 + 0.5, Math.max(0, dw - 1), Math.max(0, dh - 1));
      }
    }
  }

  ctx.strokeStyle = '#3a475f';
  ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
  drawWalkableOverlay();

  stat1.textContent = `z=${z} mode=${modeSel.value} span=${worldSpanX.toFixed(1)}wu tiles=${drawn}`;
  requestAnimationFrame(render);
}

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  dragLastX = e.clientX;
  dragLastY = e.clientY;
});
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragLastX;
  const dy = e.clientY - dragLastY;
  dragLastX = e.clientX;
  dragLastY = e.clientY;

  const w = Math.max(1, canvas.clientWidth);
  const h = Math.max(1, canvas.clientHeight);
  const spanY = worldSpanX * (h / w);
  centerX -= dx / w * worldSpanX;
  centerZ -= dy / h * spanY;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoom = Math.exp(e.deltaY * 0.0015);
  const minSpan = minPointToPointSpanX();
  worldSpanX = Math.max(minSpan, Math.min(2_000_000, worldSpanX * zoom));
}, { passive: false });

sourceSel.addEventListener('change', async () => {
  imageCache.clear();
  await loadIndex(sourceSel.value);
});

async function loadSourceList() {
  const fallback = [{ name: 'stage3 merged', path: './tiles' }];
  let items = fallback;
  try {
    const r = await fetch('./tiles/sources.json');
    if (r.ok) {
      const j = await r.json();
      if (j && Array.isArray(j.sources) && j.sources.length > 0) {
        items = j.sources
          .filter((x) => x && typeof x.path === 'string' && x.path.length > 0)
          .map((x) => ({ name: typeof x.name === 'string' && x.name ? x.name : x.path, path: x.path }));
      }
    }
  } catch (_) {}

  sourceSel.innerHTML = '';
  for (const src of items) {
    const op = document.createElement('option');
    op.value = src.path;
    op.textContent = src.name;
    sourceSel.appendChild(op);
  }
  sourceSel.value = items[0].path;
  return items[0].path;
}

(async () => {
  try {
    const root = await loadSourceList();
    await loadIndex(root);
  } catch (e) {
    stat1.textContent = String(e);
  }
  render();
})();
</script>
</body>
</html>
