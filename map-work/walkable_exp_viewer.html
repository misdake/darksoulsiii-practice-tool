<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkable Param Overlay Viewer</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#0d1016; color:#e8edf7; font-family:Consolas, monospace; overflow:hidden; }
    #ui { position:absolute; z-index:2; left:10px; top:10px; background:rgba(20,24,32,0.95); border:1px solid #2f3747; border-radius:8px; padding:10px; width:480px; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    select, input { flex:1; background:#151922; color:#e8edf7; border:1px solid #2f3747; border-radius:6px; padding:4px 8px; }
    label { min-width:56px; color:#9aa7bf; }
    #stat { font-size:12px; color:#aeb8cc; }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="row"><label>Group</label><input id="group" value="cemetery_of_ash1" /></div>
    <div class="row"><label>Param</label><select id="param"></select></div>
    <div class="row"><label>Alpha</label><input id="alpha" type="range" min="0" max="1" step="0.05" value="0.75" /></div>
    <div id="legend" style="font-size:12px; color:#c9d3e6; line-height:1.4; margin-bottom:8px;">
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(20,220,110,0.8);margin-right:6px;"></span>绿色: 可移动（Walkable）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(220,60,40,0.8);margin-right:6px;"></span>红色: 不可移动（未知原因）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(120,120,120,0.9);margin-right:6px;"></span>灰色: 无观测（NoObs）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(110,160,255,0.9);margin-right:6px;"></span>浅蓝: 观测不足（LowObs）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(255,170,60,0.9);margin-right:6px;"></span>橙色: 高度带失败（HeightBand）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(255,80,80,0.9);margin-right:6px;"></span>亮红: 通路失败（SupportPath）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(210,70,220,0.9);margin-right:6px;"></span>紫色: 胶囊失败（Capsule）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(80,255,255,0.9);margin-right:6px;"></span>青色: 连通性回退（Disconnected）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(255,216,64,0.9);margin-right:6px;"></span>黄色: Frontier（可扩张边界）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(80,160,255,0.9);margin-right:6px;"></span>蓝色: 轨迹内漏检（应可走但未判可走）</div>
      <div><span style="display:inline-block;width:12px;height:12px;background:rgba(255,40,220,0.9);margin-right:6px;"></span>品红: 外扩误检（应不可走但判可走）</div>
    </div>
    <div id="shot" style="font-size:12px; color:#c9d3e6; margin-bottom:8px;">camera: -</div>
    <div id="stat">Loading...</div>
  </div>
  <canvas id="cv"></canvas>
  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const groupInput = document.getElementById('group');
    const paramSel = document.getElementById('param');
    const alphaInput = document.getElementById('alpha');
    const stat = document.getElementById('stat');
    const shot = document.getElementById('shot');

    let tileIndex = null, levelMaps = new Map(), levelList = [];
    let overlayMeta = null, overlayImg = null;
    let trajectoryLoop = [];
    let centerX = 0, centerZ = 0, worldSpanX = 1024;
    let dragging = false, lastX = 0, lastY = 0;
    const imageCache = new Map();
    let picked = null;

    function decodeCoord(name){ const v = Number(name); return Number.isInteger(v) ? v : null; }
    function encodeCoord(v){ return String(v); }

    function worldToScreen(wx, wz){
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const spanY = worldSpanX * (h / Math.max(1,w));
      const x = ((wx - (centerX - worldSpanX/2)) / worldSpanX) * w;
      const y = ((wz - (centerZ - spanY/2)) / spanY) * h;
      return [x,y];
    }

    function screenToWorld(sx, sy){
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const spanY = worldSpanX * (h / Math.max(1,w));
      const wx = (sx / Math.max(1,w)) * worldSpanX + (centerX - worldSpanX / 2);
      const wz = (sy / Math.max(1,h)) * spanY + (centerZ - spanY / 2);
      return [wx, wz];
    }

    async function loadAll() {
      const group = groupInput.value.trim();
      const stageRoot = `/map-work/stage2/${group}/tiles`;
      const overlayRoot = `/map-work/walkable-exp/${group}/rasters`;
      const trajPath = `/capture/${group}/trajectory.json`;

      tileIndex = await (await fetch(`${stageRoot}/index.json`)).json();
      levelMaps.clear();
      for (const [z, lv] of Object.entries(tileIndex.levels)) {
        const xMap = new Map();
        for (const [xName, yArr] of Object.entries(lv.x)) xMap.set(xName, new Set(yArr));
        levelMaps.set(z, xMap);
      }
      levelList = Object.keys(tileIndex.levels).map(Number).sort((a,b)=>a-b);

      const rasterIndex = await (await fetch(`${overlayRoot}/index.json`)).json();
      trajectoryLoop.length = 0;
      try {
        const traj = await (await fetch(trajPath)).json();
        const loops = Array.isArray(traj.loops) ? traj.loops : [];
        const first = Array.isArray(loops[0]) ? loops[0] : [];
        for (const p of first) {
          if (!Array.isArray(p) || p.length < 3) continue;
          const x = Number(p[0]);
          const zGame = Number(p[2]);
          if (!Number.isFinite(x) || !Number.isFinite(zGame)) continue;
          trajectoryLoop.push([x, -zGame]); // viewer world z uses processor sign
        }
      } catch (_) {
        // keep empty trajectory if missing
      }
      paramSel.innerHTML = '';
      for (const e of rasterIndex.entries) {
        const op = document.createElement('option');
        op.value = JSON.stringify(e);
        const imgName = (e.image || '').split('/').pop() || e.image || '-';
        op.textContent = `#${e.id} ${e.label} [${imgName}]`;
        paramSel.appendChild(op);
      }
      if (rasterIndex.entries.length > 0) {
        const preferred = rasterIndex.entries.find(e => String(e.image || '').includes('sim_walkable_post.png'));
        overlayMeta = preferred || rasterIndex.entries[0];
        paramSel.value = JSON.stringify(overlayMeta);
        await loadOverlayImage(group, overlayMeta);
      }
      fitToFinestBounds();
      render();
    }

    async function loadOverlayImage(group, meta){
      const img = new Image();
      img.src = `/map-work/walkable-exp/${group}/${meta.image}`;
      await img.decode();
      overlayImg = img;
      overlayMeta = meta;
    }

    function fitToFinestBounds() {
      const z = String(levelList[levelList.length - 1]);
      const lv = tileIndex.levels[z];
      const tw = lv.tile_world_size;
      let minTx=Infinity,maxTx=-Infinity,minTy=Infinity,maxTy=-Infinity;
      for (const [xName,yArr] of Object.entries(lv.x)) {
        const tx = decodeCoord(xName); if (tx==null) continue;
        minTx = Math.min(minTx, tx); maxTx = Math.max(maxTx, tx);
        for (const yName of yArr) { const ty = decodeCoord(yName); if (ty==null) continue; minTy=Math.min(minTy,ty); maxTy=Math.max(maxTy,ty); }
      }
      const minX = minTx*tw, maxX = (maxTx+1)*tw, minZ = minTy*tw, maxZ=(maxTy+1)*tw;
      centerX = (minX+maxX)/2; centerZ = (minZ+maxZ)/2; worldSpanX = Math.max(maxX-minX, tw*4);
    }

    function ensureTile(url){
      if (imageCache.has(url)) return imageCache.get(url);
      const st = {img:new Image(), ok:false, done:false};
      st.img.onload=()=>{st.ok=true;st.done=true;render();};
      st.img.onerror=()=>{st.done=true;render();};
      st.img.src=url;
      imageCache.set(url, st);
      return st;
    }

    function render(){
      const w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = Math.max(1, w * devicePixelRatio);
      canvas.height = Math.max(1, h * devicePixelRatio);
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#0d1016'; ctx.fillRect(0,0,w,h);
      if (!tileIndex) return;

      const z = String(levelList[levelList.length - 1]);
      const lv = tileIndex.levels[z];
      const xMap = levelMaps.get(z);
      const tw = lv.tile_world_size;
      const spanY = worldSpanX * (h / Math.max(1,w));
      const minX = centerX - worldSpanX/2, maxX = centerX + worldSpanX/2;
      const minZ = centerZ - spanY/2, maxZ = centerZ + spanY/2;
      const tx0 = Math.floor(minX/tw), tx1 = Math.floor(maxX/tw);
      const ty0 = Math.floor(minZ/tw), ty1 = Math.floor(maxZ/tw);
      let drawn = 0;
      const cornerCache = new Map();
      const key2 = (tx, ty) => `${tx},${ty}`;
      const getCorner = (tx, ty) => {
        const k = key2(tx, ty);
        let p = cornerCache.get(k);
        if (!p) {
          p = worldToScreen(tx * tw, ty * tw);
          cornerCache.set(k, p);
        }
        return p;
      };
      for (let tx=tx0; tx<=tx1; tx++) {
        const ys = xMap.get(encodeCoord(tx)); if (!ys) continue;
        for (let ty=ty0; ty<=ty1; ty++) {
          const yName = encodeCoord(ty); if (!ys.has(yName)) continue;
          const turl = `/map-work/stage2/${groupInput.value.trim()}/tiles/${z}/${encodeCoord(tx)}/${yName}.png`;
          const st = ensureTile(turl);
          const [sx0,sy0] = getCorner(tx, ty);
          const [sx1,sy1] = getCorner(tx + 1, ty + 1);
          if (st.done && st.ok) { ctx.drawImage(st.img, Math.round(sx0), Math.round(sy0), Math.round(sx1-sx0), Math.round(sy1-sy0)); drawn++; }
        }
      }
      if (overlayImg && overlayMeta) {
        const minOx = overlayMeta.min_x;
        const minOz = overlayMeta.min_z;
        const maxOx = minOx + overlayMeta.width_px * overlayMeta.grid_res_world;
        const maxOz = minOz + overlayMeta.height_px * overlayMeta.grid_res_world;
        const [sx0,sy0] = worldToScreen(minOx, minOz);
        const [sx1,sy1] = worldToScreen(maxOx, maxOz);
        ctx.save();
        ctx.globalAlpha = Number(alphaInput.value);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(overlayImg, Math.round(sx0), Math.round(sy0), Math.round(sx1-sx0), Math.round(sy1-sy0));
        ctx.restore();
      }
      drawTrajectory();
      drawCameraOverlayOnMap();
      drawPickedHud();
      if (overlayMeta && overlayMeta.camera_position_game) {
        const c = overlayMeta.camera_position_game;
        const stepText = overlayMeta.step ? `step ${overlayMeta.step}` : 'final';
        shot.textContent = `${stepText} camera(game): (${c[0].toFixed(3)}, ${c[1].toFixed(3)}, ${c[2].toFixed(3)})`;
      } else {
        shot.textContent = 'camera: -';
      }
      stat.textContent = `tiles=${drawn} overlay=${overlayMeta ? overlayMeta.label : '-'} alpha=${alphaInput.value}`;
    }

    function drawPickedHud() {
      if (!picked) return;
      const wx = picked.wx;
      const wz = picked.wz;
      const ix = Math.floor(wx / 0.125);
      const iz = Math.floor(wz / 0.125);
      const lines = [
        `pick world: x=${wx.toFixed(3)} z=${wz.toFixed(3)}`,
        `pick cell: (${ix}, ${iz})`,
      ];
      ctx.save();
      ctx.font = '12px Consolas, monospace';
      ctx.textBaseline = 'top';
      const pad = 8;
      const lineH = 16;
      let w = 0;
      for (const t of lines) w = Math.max(w, ctx.measureText(t).width);
      const boxW = Math.ceil(w) + 12;
      const boxH = lines.length * lineH + 8;
      const x = canvas.clientWidth - boxW - pad;
      const y = pad;
      ctx.fillStyle = 'rgba(12, 16, 24, 0.85)';
      ctx.fillRect(x, y, boxW, boxH);
      ctx.strokeStyle = 'rgba(120, 140, 170, 0.8)';
      ctx.strokeRect(x + 0.5, y + 0.5, boxW - 1, boxH - 1);
      ctx.fillStyle = '#dbe7ff';
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x + 6, y + 4 + i * lineH);
      }
      ctx.restore();
    }

    function drawTrajectory() {
      if (!trajectoryLoop || trajectoryLoop.length < 2) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 245, 120, 0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const [x0, z0] = trajectoryLoop[0];
      const [sx0, sy0] = worldToScreen(x0, z0);
      ctx.moveTo(sx0, sy0);
      for (let i = 1; i < trajectoryLoop.length; i++) {
        const [x, z] = trajectoryLoop[i];
        const [sx, sy] = worldToScreen(x, z);
        ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    function drawCameraOverlayOnMap() {
      if (!overlayMeta || !overlayMeta.camera_position_game) return;
      const c = overlayMeta.camera_position_game;
      const wx = c[0];
      const wz = -c[2]; // stage2/overlay uses processor-z orientation
      const [sx, sy] = worldToScreen(wx, wz);
      const stepText = overlayMeta.step ? `step ${overlayMeta.step}` : 'final';
      const label = `${stepText} cam (${c[0].toFixed(2)}, ${c[1].toFixed(2)}, ${c[2].toFixed(2)})`;

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 90, 90, 0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx - 10, sy);
      ctx.lineTo(sx + 10, sy);
      ctx.moveTo(sx, sy - 10);
      ctx.lineTo(sx, sy + 10);
      ctx.stroke();

      ctx.font = '12px Consolas, monospace';
      ctx.textBaseline = 'top';
      const tw = ctx.measureText(label).width;
      const tx = sx + 10;
      const ty = sy - 18;
      ctx.fillStyle = 'rgba(16, 20, 28, 0.85)';
      ctx.fillRect(tx - 4, ty - 2, tw + 8, 18);
      ctx.fillStyle = '#ffe5e5';
      ctx.fillText(label, tx, ty);
      ctx.restore();
    }

    canvas.addEventListener('mousedown', (e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
    window.addEventListener('mouseup', ()=>dragging=false);
    window.addEventListener('mousemove', (e)=>{
      if (!dragging) return;
      const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
      const w=Math.max(1,canvas.clientWidth), h=Math.max(1,canvas.clientHeight);
      centerX -= dx / w * worldSpanX;
      centerZ -= dy / h * (worldSpanX * (h / w));
      render();
    });
    canvas.addEventListener('wheel', (e)=>{ e.preventDefault(); worldSpanX = Math.max(4, Math.min(8192, worldSpanX * Math.exp(e.deltaY*0.0015))); render(); }, {passive:false});
    canvas.addEventListener('click', (e)=>{
      const r = canvas.getBoundingClientRect();
      const sx = e.clientX - r.left;
      const sy = e.clientY - r.top;
      const [wx, wz] = screenToWorld(sx, sy);
      picked = { wx, wz };
      render();
    });

    groupInput.addEventListener('change', async ()=>{ imageCache.clear(); await loadAll(); });
    paramSel.addEventListener('change', async ()=>{
      const meta = JSON.parse(paramSel.value);
      await loadOverlayImage(groupInput.value.trim(), meta);
      render();
    });
    alphaInput.addEventListener('input', render);

    window.addEventListener('resize', render);
    loadAll().catch((e)=>{ stat.textContent = String(e); });
  </script>
</body>
</html>
