<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS3 Walk Surface Viewer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171b22;
      --line: #2a3342;
      --text: #e7edf7;
      --muted: #9fb0c9;
      --accent: #6ee7ff;
      --ok: #87f5b1;
      --warn: #ffd27d;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #1a2432 0%, var(--bg) 50%);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(600px, calc(100vw - 32px));
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }
    .row label {
      color: var(--muted);
      font-size: 12px;
    }
    input[type="text"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .toggles {
      display: flex;
      gap: 14px;
      margin: 10px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      border: 1px solid var(--line);
      background: #111723;
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      border-color: var(--accent);
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--ok);
      white-space: pre-wrap;
    }
    #hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--warn);
    }
    #objectMenu {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #0d1117;
      max-height: 220px;
      overflow: auto;
    }
    #objectMenuTitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .obj-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="panel">
    <div class="row">
      <label>Import List</label>
      <input id="importListPath" type="text" value="./import-list.json" />
    </div>
    <div class="toggles">
      <label><input id="showCollision" type="checkbox" checked /> show collision</label>
      <label><input id="showWalkable" type="checkbox" checked /> show walkable</label>
      <label><input id="wireframe" type="checkbox" /> wireframe</label>
    </div>
    <div class="actions">
      <button id="loadBtn">Load</button>
      <button id="fitBtn">Fit Camera</button>
      <button id="exportEnabledBtn">Export Enabled</button>
    </div>
    <div id="status">ready</div>
    <div id="objectMenu">
      <div id="objectMenuTitle">Objects</div>
      <div id="objectList"></div>
    </div>
    <div id="hint">Serve from repo root (example: `python -m http.server 8080`), then open `/ds3-walk-surface/web/`.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
